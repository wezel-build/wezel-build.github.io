<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">Wezel cut W logo concepts</title>
  <desc id="desc">Six simple Wezel mark variants using the existing terracotta and warm paper palette.</desc>
  <defs>
    <style>
      .page {
        fill: #fbfaf6;
      }

      .tile {
        fill: #b85229;
      }

      .paper {
        fill: #fbfaf6;
      }

      .ink {
        fill: #1c1b18;
      }

      .caption {
        fill: #57544c;
        font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .label {
        fill: #716e65;
        font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0;
      }

      .mark {
        fill: none;
        stroke: #fbfaf6;
        stroke-linejoin: round;
      }

      .round {
        stroke-linecap: round;
      }

      .square {
        stroke-linecap: square;
      }
    </style>

    <symbol id="tile-base" viewBox="0 0 112 112">
      <rect width="112" height="112" rx="24" class="tile" />
    </symbol>

    <symbol id="mark-balanced" viewBox="0 0 112 112">
      <use href="#tile-base" />
      <g class="mark round" stroke-width="11.8">
        <path d="M29 35 46 77 64 35" />
        <path d="M70 77 88 35" />
      </g>
    </symbol>

    <symbol id="mark-wide" viewBox="0 0 112 112">
      <use href="#tile-base" />
      <g class="mark round" stroke-width="10.8">
        <path d="M24 34 43 78 64 34" />
        <path d="M73 78 90 34" />
      </g>
    </symbol>

    <symbol id="mark-compact" viewBox="0 0 112 112">
      <use href="#tile-base" />
      <g class="mark round" stroke-width="12.4">
        <path d="M34 33 48 79 63 33" />
        <path d="M70 79 79 33" />
      </g>
    </symbol>

    <symbol id="mark-chisel" viewBox="0 0 112 112">
      <use href="#tile-base" />
      <g class="paper">
        <polygon points="24,32 35,32 51,76 42,80" />
        <polygon points="44,76 62,32 73,32 54,80" />
        <polygon points="70,76 83,32 94,32 80,80" />
      </g>
    </symbol>

    <symbol id="mark-slab" viewBox="0 0 112 112">
      <use href="#tile-base" />
      <g class="mark square" stroke-width="10.8">
        <path d="M28 35 45 77 64 35" />
        <path d="M74 77 87 35" />
      </g>
    </symbol>

    <symbol id="mark-word" viewBox="0 0 228 112">
      <rect x="0" y="0" width="112" height="112" rx="24" class="tile" />
      <g class="mark round" stroke-width="11.8">
        <path d="M29 35 46 77 64 35" />
        <path d="M70 77 88 35" />
      </g>
      <text
        x="132"
        y="70"
        class="ink"
        font-family="Instrument Serif, Georgia, Times New Roman, serif"
        font-size="42"
        letter-spacing="0"
      >wezel</text>
    </symbol>
  </defs>

  <rect width="920" height="560" class="page" />
  <text x="60" y="58" class="ink" font-family="Instrument Serif, Georgia, Times New Roman, serif" font-size="38" letter-spacing="0">Wezel cut W</text>
  <text x="60" y="86" class="caption">Simple W, second downstroke removed, existing warm tile preserved.</text>

  <g transform="translate(60 128)">
    <use href="#mark-balanced" width="112" height="112" />
    <text x="0" y="148" class="caption">Balanced</text>
    <text x="0" y="169" class="label">best first pass</text>
  </g>

  <g transform="translate(230 128)">
    <use href="#mark-wide" width="112" height="112" />
    <text x="0" y="148" class="caption">Wide</text>
    <text x="0" y="169" class="label">more glyph-like</text>
  </g>

  <g transform="translate(400 128)">
    <use href="#mark-compact" width="112" height="112" />
    <text x="0" y="148" class="caption">Compact</text>
    <text x="0" y="169" class="label">favicon-heavy</text>
  </g>

  <g transform="translate(570 128)">
    <use href="#mark-chisel" width="112" height="112" />
    <text x="0" y="148" class="caption">Chisel</text>
    <text x="0" y="169" class="label">sharper cuts</text>
  </g>

  <g transform="translate(740 128)">
    <use href="#mark-slab" width="112" height="112" />
    <text x="0" y="148" class="caption">Slab</text>
    <text x="0" y="169" class="label">less soft</text>
  </g>

  <g transform="translate(60 365)">
    <use href="#mark-word" width="228" height="112" />
    <text x="0" y="148" class="caption">Lockup check</text>
    <text x="0" y="169" class="label">mark beside current wordmark style</text>
  </g>

  <g transform="translate(374 367)">
    <rect width="112" height="112" rx="24" fill="#b85229" />
    <g class="mark round" stroke-width="11.8">
      <path d="M29 35 46 77 64 35" />
      <path d="M70 77 88 35" />
    </g>
    <text x="0" y="146" class="caption">Token orange</text>
    <text x="0" y="167" class="label">global --color-accent</text>
  </g>

  <g transform="translate(546 367)">
    <rect width="112" height="112" rx="24" fill="#f4f1ea" />
    <g fill="none" stroke="#b85229" stroke-width="11.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 35 46 77 64 35" />
      <path d="M70 77 88 35" />
    </g>
    <text x="0" y="146" class="caption">Reverse</text>
    <text x="0" y="167" class="label">light surface use</text>
  </g>
</svg>
