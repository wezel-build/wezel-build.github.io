# Sidebar navigation for the documentation.
#
# This file is the single source of truth for docs structure. It lives beside
# the Markdown so the two move together.
#
# Every page under this directory must be listed exactly once. The build fails
# if a page is missing from this file, listed twice, or listed here without a
# matching file - see src/lib/docs-navigation.ts.
#
# `id` is the collection entry id: the path relative to src/content/docs/
# without the .md extension. `index` is the /docs landing page.
# An item may carry `id`, nested `items`, or both; an item with only `items` is
# a pure category label.

- label: Wezel CLI
  items:
    - label: Install Wezel
      id: installation
    - label: Your first measurement
      id: index
    - label: Build a multi-step scenario
      id: cli/multi-step-scenario
    - label: Measure non-deterministic processes
      id: cli/non-deterministic-processes
    - label: How scenarios produce outcomes
      id: cli/scenario-outcomes

- label: Wezel Dashboard
  items:
    - label: Connect a project
      id: dashboard/connect-project
    - label: Track performance over time
      id: dashboard/track-performance
    - label: Investigate regressions
      id: dashboard/investigate-regressions
    - label: Runners
      id: dashboard/runners
    - label: Notifications
      id: dashboard/notifications

- label: Reference
  items:
    - label: Scenario configuration
      id: reference/scenario-configuration
    - label: Wezel CLI
      id: reference/cli
