# Sidebar navigation for the documentation.
#
# This file is the single source of truth for docs structure. It lives beside
# the Markdown so the two move together.
#
# Every page under this directory must be listed exactly once. The build fails
# if a page is missing from this file, listed twice, or listed here without a
# matching file - see src/lib/docs-navigation.ts.
#
# `id` is the collection entry id: the path relative to src/content/docs/
# without the .md extension. `index` is the /docs landing page.
# An item may carry `id`, nested `items`, or both; an item with only `items` is
# a pure category label.

- label: Get started
  items:
    - label: Introduction
      id: index
    - label: Installation
      id: installation
    - label: Quickstart
      id: quickstart

- label: Concepts
  items:
    - label: Experiments
      id: concepts/experiments
    - label: Observations
      id: concepts/observations
    - label: Regressions
      id: concepts/regressions

# Server before tracking: you stand somewhere up to send results to before you
# start sending them.
- label: Server
  items:
    - label: Overview
      id: server/overview
    - label: Self-hosting
      id: server/self-hosting

- label: Tracking
  items:
    - label: Scenarios
      id: tracking/scenarios
    - label: Continuous integration
      id: tracking/continuous-integration

- label: Reference
  items:
    - label: CLI
      id: reference/cli
    - label: Configuration
      id: reference/configuration
